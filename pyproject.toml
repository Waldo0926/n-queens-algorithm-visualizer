[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n-queens-algorithm-visualizer"
version = "1.0.0"
description = "Compare and visualize backtracking, pruned state-space search, and hill climbing on the N-Queens problem."
requires-python = ">=3.10"
readme = "README.md"
keywords = ["n-queens", "backtracking", "hill-climbing", "algorithms", "visualization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Education",
]

[project.scripts]
nqueens = "nqueens.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
